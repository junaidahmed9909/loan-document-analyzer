name: Benchmark

# Measures extraction accuracy on the labelled evaluation set and end-to-end API latency.
# Runs in search-only mode (no API key), so the accuracy shown is rules-only.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/benchmark.yml', 'sample-docs/eval/**']

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build
        run: mvn -B -q package -DskipTests

      - name: Extraction accuracy (rules only)
        run: java -cp target/classes com.junaid.loan.core.ExtractionEval sample-docs/eval | tee eval.txt

      - name: Start the app
        run: |
          java -jar target/loan-document-analyzer-*.jar > app.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null; then echo "App is up"; exit 0; fi
            sleep 3
          done
          tail -100 app.log
          exit 1

      - name: API latency (100 three-document cases, then 100 questions)
        run: |
          D=sample-docs
          for i in $(seq 1 5); do  # warm-up
            curl -s -o /dev/null -F files=@$D/james-carter-application.txt -F files=@$D/james-carter-paystub.txt \
              -F files=@$D/james-carter-bank-statement.txt http://localhost:8080/api/cases
          done
          : > analyze.txt
          for i in $(seq 1 100); do
            curl -s -o case.json -w "%{time_total}\n" -F files=@$D/james-carter-application.txt \
              -F files=@$D/james-carter-paystub.txt -F files=@$D/james-carter-bank-statement.txt \
              http://localhost:8080/api/cases >> analyze.txt
          done
          ID=$(jq -r .id case.json)
          : > ask.txt
          for i in $(seq 1 100); do
            curl -s -o /dev/null -w "%{time_total}\n" -H 'Content-Type: application/json' \
              -d '{"question":"Where is the down payment coming from?"}' \
              http://localhost:8080/api/cases/$ID/questions >> ask.txt
          done
          jq '{risk: .risk.level, flags: [.risk.flags[].code]}' case.json

      - name: Write summary
        if: always()
        run: |
          stats() { sort -n "$1" | awk '{a[NR]=$1*1000} END {printf "median %.1f ms, p95 %.1f ms", a[int(NR*0.5)], a[int(NR*0.95)]}'; }
          {
            echo "## Benchmark results"
            echo
            echo "Runner: GitHub-hosted ubuntu-latest ($(nproc) vCPU), $(date -u +%Y-%m-%d)"
            echo
            echo "### Extraction accuracy (rules only, no LLM)"
            echo '```'; cat eval.txt 2>/dev/null; echo '```'
            [ -s analyze.txt ] && echo "- Analyze a 3-document case (upload, extract, risk checks, index): $(stats analyze.txt)"
            [ -s ask.txt ] && echo "- Answer a question (search-only mode): $(stats ask.txt)"
          } | tee -a "$GITHUB_STEP_SUMMARY"
